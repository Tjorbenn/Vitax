name: Build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install
        run: |
          npm ci

      - name: Lint
        run: |
          npm run lint

      - name: Test
        run: |
          npm run test:coverage

      - name: Build
        run: |
          npm run build

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vitax-production
          path: dist/

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="dns-prefetch" href="https://neighbors.evolbio.mpg.de" />
    <link rel="preconnect" href="https://neighbors.evolbio.mpg.de" />
    <link rel="dns-prefetch" href="https://api.ncbi.nlm.nih.gov" />
    <link rel="dns-prefetch" href="https://api.semanticscholar.org" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Vitax</title>
    <link rel="canonical" href="https://neighbors.evolbio.mpg.de/vitax/" />

    <meta name="title" content="Vitax" />
    <meta name="description" content="Visualizing the NCBI Taxonomy" />

    <link rel="icon" href="/images/favicon.ico" sizes="any" />
    <link rel="icon" href="/images/logo_green.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon-180x180.png" />
    <link rel="mask-icon" href="/images/logo_green.svg" color="#006c66" />

    <meta name="theme-color" content="#006c66" />

    <meta
      name="keywords"
      content="taxonomy, ncbi, ncbi taxonomy, phylogeny, classification, phylogenetic tree, taxonomy visualization, evolutionary biology, bioinformatics"
    />
    <meta name="author" content="Tjorben Nawroth" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://neighbors.evolbio.mpg.de/vitax/" />
    <meta property="og:title" content="Vitax" />
    <meta property="og:description" content="Visualizing the NCBI Taxonomy" />
    <meta
      property="og:image"
      content="https://neighbors.evolbio.mpg.de/vitax/images/logo_green.svg"
    />
  </head>

  <body id="app" class="h-full w-full overflow-hidden">
    <main class="relative h-full w-full" role="main" aria-label="Taxonomy visualization interface">
      <div
        id="menu-overlay"
        class="pointer-events-none relative z-10 flex h-full w-full flex-col justify-between gap-3 p-3 md:gap-6 md:p-6"
        role="region"
        aria-label="Main navigation and controls"
      >
        <header
          id="menu-header"
          class="relative flex h-fit w-full flex-col gap-2 md:grid md:grid-cols-[1fr_minmax(0,2fr)_1fr] md:items-center md:gap-4"
          role="banner"
        >
          <div class="relative z-50 hidden justify-self-start md:block">
            <vitax-title
              class="card card-xs card-border bg-base-100/40 bounce animated pointer-events-auto block cursor-pointer shadow-lg backdrop-blur-sm"
              role="link"
              aria-label="Vitax home"
            ></vitax-title>
          </div>

          <vitax-search
            class="pointer-events-auto w-full justify-self-center md:col-start-2"
            role="search"
          ></vitax-search>
          <div
            class="pointer-events-none hidden items-center justify-end gap-2 md:col-start-3 md:flex md:justify-self-end"
          >
            <vitax-image-button
              class="tooltip tooltip-left pointer-events-auto"
              data-tip="Image"
            ></vitax-image-button>
            <vitax-settings-button
              class="tooltip tooltip-left pointer-events-auto"
              data-tip="Settings"
            ></vitax-settings-button>
          </div>
        </header>
        <div
          id="menu-middle"
          class="flex w-full flex-1 flex-row items-start justify-between"
          role="complementary"
          aria-label="Visualization controls"
        >
          <div class="flex h-full flex-col items-start justify-between">
            <vitax-list
              class="pointer-events-auto block h-full"
              role="navigation"
              aria-label="Taxon list"
            ></vitax-list>
          </div>
          <div class="relative flex h-full flex-col items-end"></div>
        </div>
        <footer
          id="menu-footer"
          class="relative flex w-full items-center justify-center md:grid md:grid-cols-[1fr_auto_1fr] md:gap-4"
          role="contentinfo"
        >
          <div class="hidden justify-self-start md:col-start-1 md:block">
            <vitax-accession-filter
              class="tooltip tooltip-right pointer-events-auto"
            ></vitax-accession-filter>
          </div>
          <vitax-visualization-type
            class="card card-xs card-border bg-base-100/40 bounce animated tooltip pointer-events-auto w-full justify-self-center p-0 shadow-lg backdrop-blur-sm md:col-start-2 md:w-auto"
            data-tip="Visualization Type"
            role="group"
            aria-label="Visualization type selector"
          ></vitax-visualization-type>
          <vitax-legend
            class="pointer-events-auto hidden justify-self-end md:relative md:col-start-3 md:block md:w-48"
            role="complementary"
            aria-label="Visualization legend"
          ></vitax-legend>

          <div
            id="mobile-controls-column"
            class="pointer-events-none fixed right-3 bottom-20 z-40 flex flex-col items-end gap-2.5 md:hidden"
          >
            <vitax-settings-button class="pointer-events-auto"></vitax-settings-button>

            <vitax-image-button class="pointer-events-auto"></vitax-image-button>

            <vitax-legend class="pointer-events-auto relative mb-6 block"></vitax-legend>

            <vitax-accession-filter class="pointer-events-auto"></vitax-accession-filter>

            <label
              id="drawer-button-mobile"
              for="list-drawer"
              class="card card-xs card-border bg-primary border-primary text-primary-content bounce animated pointer-events-auto flex size-10 cursor-pointer items-center justify-center rounded-xl shadow-lg"
              aria-label="Toggle taxon list"
            >
              <span
                class="icon-[material-symbols--list-alt-rounded] text-2xl"
                aria-hidden="true"
              ></span>
            </label>
          </div>
        </footer>
      </div>
      <vitax-canvas
        class="absolute inset-0 h-full w-full"
        role="img"
        aria-label="Taxonomy visualization canvas"
      >
        <vitax-taxon-action
          class="hidden"
          role="toolbar"
          aria-label="Taxon actions"
        ></vitax-taxon-action>
      </vitax-canvas>
    </main>
    <vitax-welcome role="dialog" aria-label="Welcome message"></vitax-welcome>
    <script type="module" src="/src/init.ts"></script>
  </body>
</html>

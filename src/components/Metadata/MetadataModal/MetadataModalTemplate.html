<dialog
  class="modal modal-bottom sm:modal-middle"
  aria-labelledby="taxon-name"
  aria-describedby="taxon-id"
>
  <div
    class="modal-box bg-base-100 flex max-h-[calc(100vh-5em)] w-11/12 max-w-4xl flex-col overflow-hidden p-0 shadow-2xl"
    role="document"
  >
    <div class="bg-base-200/50 border-base-300 relative shrink-0 border-b px-6 py-10">
      <div class="relative z-10 flex flex-col items-center justify-center gap-5">
        <vitax-data-image
          class="shrink-0 drop-shadow-md transition-transform hover:scale-105"
          role="img"
          aria-label="Taxon image"
        ></vitax-data-image>

        <div class="flex w-full flex-col items-center justify-center gap-4 text-center">
          <hgroup
            id="taxon-popover-header"
            class="flex w-full flex-col items-center justify-center gap-3"
          >
            <div class="flex flex-wrap items-center justify-center gap-3">
              <h1
                id="taxon-name"
                class="text-base-content m-0 text-2xl leading-tight font-extrabold tracking-tight sm:text-3xl md:text-4xl"
                role="heading"
                aria-level="1"
              ></h1>
              <span
                id="taxon-id"
                class="badge badge-primary badge-md font-mono shadow-sm"
                aria-label="Taxon ID"
              ></span>
            </div>
            <div
              id="taxon-rank-container"
              class="text-base-content/50 inline-flex items-center justify-center gap-1.5 text-sm font-bold tracking-widest uppercase"
            >
              <span id="taxon-rank-icon" class="flex items-center justify-center opacity-80"></span>
              <span id="taxon-rank-value"></span>
            </div>
          </hgroup>
          <vitax-data-links
            class="flex w-full justify-center"
            role="region"
            aria-label="External links"
          ></vitax-data-links>
        </div>
      </div>

      <button
        id="modal-close"
        class="btn btn-sm btn-circle btn-ghost absolute top-4 right-4"
        aria-label="Close modal"
      >
        <span class="icon-[material-symbols--close-rounded] text-xl"></span>
      </button>
    </div>

    <div
      class="bg-base-100 hide-scrollbar min-h-0 flex-1 overflow-y-auto overscroll-contain p-6 sm:p-8"
    >
      <div class="flex flex-col gap-12">
        <div class="flex flex-col gap-4">
          <h2
            id="divider-genomes"
            class="text-base-content/90 m-0 flex items-center gap-2 font-sans text-xl font-bold"
          >
            <span class="icon-[material-symbols--genetics] text-primary h-[1.2em] w-[1.2em]"></span>
            Genomes
          </h2>
          <vitax-data-genomes role="region" aria-label="Genome information"></vitax-data-genomes>
        </div>

        <div class="flex flex-col gap-4">
          <h2
            id="divider-publications"
            class="text-base-content/90 m-0 flex items-center gap-2 font-sans text-xl font-bold"
          >
            <span
              class="icon-[material-symbols--library-books-rounded] text-secondary h-[1.2em] w-[1.2em]"
            ></span>
            Publications
          </h2>
          <vitax-data-publications
            role="region"
            aria-label="Related publications"
          ></vitax-data-publications>
        </div>
      </div>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop bg-neutral-900/40 backdrop-blur-xs">
    <button aria-label="Close modal">close</button>
  </form>
</dialog>

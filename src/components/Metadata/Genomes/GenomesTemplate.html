<div class="border-base-300 bg-base-100 overflow-hidden rounded-2xl border shadow-sm">
  <div class="overflow-x-auto">
    <table id="genomes-table" class="table-zebra table-sm table w-full align-middle">
      <thead class="text-base-content/80">
        <tr>
          <th
            scope="col"
            class="bg-base-200/50 py-3 pl-4 text-left text-xs font-semibold tracking-wider uppercase"
          >
            Level
          </th>
          <th scope="col" class="bg-base-200/50 py-3 text-center">
            <div
              class="flex items-center justify-center gap-1.5 text-xs font-semibold tracking-wider uppercase"
            >
              <span
                class="icon-[material-symbols--square-dot-rounded] text-base-content/50 text-base"
              ></span>
              Direct
            </div>
          </th>
          <th scope="col" class="bg-base-200/50 py-3 pr-4 text-center">
            <div
              class="flex items-center justify-center gap-1.5 text-xs font-semibold tracking-wider uppercase"
            >
              <span
                class="icon-[material-symbols--diagonal-line] text-base-content/50 text-base"
              ></span>
              Recursive
            </div>
          </th>
        </tr>
      </thead>
      <tbody id="genomes-body">
        <tr>
          <th class="bg-base-200/50 py-3 pl-4">
            <div class="skeleton bg-base-300 h-4 w-20"></div>
          </th>
          <td class="py-3 text-center">
            <div class="skeleton bg-base-300 mx-auto h-4 w-10"></div>
          </td>
          <td class="py-3 pr-4 text-center">
            <div class="skeleton bg-base-300 mx-auto h-4 w-10"></div>
          </td>
        </tr>
      </tbody>
      <tfoot class="border-base-300 bg-base-200/50 border-t">
        <tr>
          <td class="text-base-content/70 py-3 pl-4 font-semibold">Total</td>
          <td class="py-3 text-center">
            <div class="inline-flex items-center justify-center gap-2">
              <span
                id="accessions-total-direct"
                class="text-primary text-lg font-bold tabular-nums"
                title="Total Direct"
                >-</span
              >
              <button
                class="btn btn-sm btn-circle btn-primary btn-soft shadow-xs"
                id="accessions-download-direct"
                title="Download all direct accessions"
              >
                <span class="icon-[material-symbols--download-rounded] text-lg"></span>
              </button>
            </div>
          </td>
          <td class="py-3 pr-4 text-center">
            <div class="inline-flex items-center justify-center gap-2">
              <span
                id="accessions-total-recursive"
                class="text-secondary text-lg font-bold tabular-nums"
                title="Total Recursive"
                >-</span
              >
              <button
                class="btn btn-sm btn-circle btn-secondary btn-soft shadow-xs"
                id="accessions-download-recursive"
                title="Download all recursive accessions"
              >
                <span class="icon-[material-symbols--download-rounded] text-lg"></span>
              </button>
            </div>
          </td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>

<vitax-data-genomes-download></vitax-data-genomes-download>

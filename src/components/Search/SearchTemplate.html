<search class="relative w-full">
  <fieldset
    class="card card-border animated bounce bounce-within join flex w-full max-w-full flex-row shadow-lg"
    aria-label="Taxonomy search"
  >
    <vitax-taxonomy-type></vitax-taxonomy-type>
    <label
      id="search-input-label"
      class="input join-item bg-base-100/40 grow border-none !shadow-none backdrop-blur-sm focus-within:outline-none"
      for="search-input"
    >
      <span
        class="icon-[material-symbols--search-rounded] h-[1.5em] w-[1.5em]"
        aria-hidden="true"
      ></span>
      <input
        type="search"
        id="search-input"
        placeholder="Search taxa..."
        aria-label="Search for taxa"
        aria-autocomplete="list"
        aria-controls="suggestions-body"
      />
      <div class="hidden items-center gap-1 md:flex" aria-label="Keyboard shortcut Control K">
        <kbd class="kbd kbd-sm bg-neutral text-neutral-content">CTRL</kbd>
        <span>+</span>
        <kbd class="kbd kbd-sm bg-neutral text-neutral-content">K</kbd>
      </div>
    </label>
    <button
      id="visualize-button"
      type="submit"
      class="btn btn-primary join-item tooltip tooltip-bottom md:tooltip-right border-none"
      aria-label="Visualize selected taxon"
    >
      <span id="visualize-text" class="hidden md:inline">Visualize</span>
      <span
        id="visualize-icon"
        class="icon-[material-symbols--account-tree-rounded] h-[1.5em] w-[1.5em] md:hidden"
        aria-hidden="true"
      ></span>
    </button>
  </fieldset>
  <section
    class="animated pointer-events-none absolute right-0 left-0 mt-4 flex flex-col items-center gap-4"
    role="region"
    aria-label="Search results"
    aria-live="polite"
  ></section>
</search>
